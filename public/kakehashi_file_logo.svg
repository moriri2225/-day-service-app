<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>カケハシファイル ロゴ</title>
<desc>丸みのある橋のアイコンと、丸ゴシック体でパステルカラーの「カケハシファイル」のワードマーク</desc>
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&amp;display=swap');
.wm { font-family: 'Kosugi Maru', 'Hiragino Maru Gothic ProN', sans-serif; }
</style>
<linearGradient id="deck5" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#7fc9c4"/>
<stop offset="1" stop-color="#f4a9c0"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="680" height="260" fill="#ffffff"/>

<circle cx="120" cy="130" r="86" fill="#fdf3ee"/>
<rect x="72" y="152" width="16" height="42" rx="8" fill="#f4a9c0"/>
<rect x="152" y="152" width="16" height="42" rx="8" fill="#7fc9c4"/>
<path d="M60 160 C 90 104, 150 104, 180 160" stroke="url(#deck5)" stroke-width="12" fill="none" stroke-linecap="round"/>
<rect x="56" y="158" width="128" height="10" rx="5" fill="#f9c97c"/>
<circle cx="88" cy="150" r="6" fill="#f9c97c"/>
<circle cx="152" cy="150" r="6" fill="#f9c97c"/>
<circle cx="120" cy="112" r="5" fill="#f4a9c0"/>

<text class="wm" x="236" y="118" font-size="46" fill="#e8829f">カケハシ</text>
<text class="wm" x="236" y="166" font-size="46" fill="#4fa39c">ファイル</text>
<rect x="236" y="182" width="330" height="5" rx="3" fill="#f9c97c"/>
<text class="wm" x="236" y="212" font-size="17" fill="#8a9a98">障がい福祉サービスをさがす、</text>
<text class="wm" x="236" y="236" font-size="17" fill="#8a9a98">子どもの記録をのこす。</text>
